map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# VibeSec: Limitacao de taxa contra forca bruta em autenticacao
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=15r/m;

server {
    listen 80;
    server_name _;

    # Ocultar versao do Nginx e tecnologia (VibeSec)
    server_tokens off;
    proxy_hide_header X-Powered-By;

    # Cabecalhos Globais de Seguranca (VibeSec - Defesa em Profundidade)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Resolver interno do Docker (127.0.0.11) com re-resolucao periodica.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 500M;
    client_body_timeout 600s;
    client_header_timeout 600s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript model/gltf+json;

    # VibeSec: Bloqueio estrito de arquivos ocultos e sensiveis (.git, .env, .htpasswd, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Download direto do App Mobile RideCheck Instrutor (APK)
    location = /downloads/ridecheck-instrutor.apk {
        alias /usr/share/nginx/html/downloads/ridecheck-instrutor.apk;
        add_header Content-Disposition 'attachment; filename="RideCheck-Instrutor.apk"' always;
        default_type application/vnd.android.package-archive;
        add_header Access-Control-Allow-Origin * always;
    }

    location = /ridecheck/downloads/ridecheck-instrutor.apk {
        alias /usr/share/nginx/html/downloads/ridecheck-instrutor.apk;
        add_header Content-Disposition 'attachment; filename="RideCheck-Instrutor.apk"' always;
        default_type application/vnd.android.package-archive;
        add_header Access-Control-Allow-Origin * always;
    }

    # 1. DECAM 3D Totem (Static files)
    location /decam/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /decam/index.html;
        add_header Access-Control-Allow-Origin *;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 1b. DECAM 3D Totem v2 (Novo Rebuild)
    location /decam-v2/ {
        alias /usr/share/nginx/html-v2/;
        index index.html;
        try_files $uri $uri/ /decam-v2/index.html;
        add_header Access-Control-Allow-Origin *;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # DECAM 3D source assets
    location /src/ {
        root /usr/share/nginx/html;
        add_header Access-Control-Allow-Origin *;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # 3a-0. NextAuth API rate limiting & protection (VibeSec)
    location ~ ^/api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        set $rc_upstream http://ridecheck-web:3001;
        rewrite ^/api/(.*)$ /ridecheck/api/$1 break;
        proxy_pass $rc_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # 3a-1. RideCheck API (com prefixo /ridecheck) -> RideCheck Web
    location ~ ^/ridecheck/api/ {
        set $rc_upstream http://ridecheck-web:3001;
        proxy_pass $rc_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # 3a-2. Bare /api/* do RideCheck
    location ~ ^/api/(auth|dashboard|checkpoints|crivo|operations|drivers|tasks|users|settings|bi|reports|effectiveness|fuel-consumption|upload|profile|announcements|notifications|operation-parameters|invite|push-tokens|cron|test-email|mobile-login|ranking|whatsapp|email) {
        set $rc_upstream http://ridecheck-web:3001;
        rewrite ^/api/(.*)$ /ridecheck/api/$1 break;
        proxy_pass $rc_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # 3b. HomeHub API (Deploy uploads, system stats, etc.)
    location /api/ {
        set $hub_upstream http://homehub-dashboard:3000;
        proxy_pass $hub_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_request_buffering off;
    }

    # 3a-2b. Deploy Center apps under /apps/<slug>/ -> HomeHub proxy
    location /apps/ {
        set $hub_upstream http://homehub-dashboard:3000;
        proxy_pass $hub_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 3a-2c/2d. Assets of sub-path deployed apps (Next.js/Vite: /_next/*, /assets/*)
    location ~ ^/(_next|assets|_app|static)/ {
        set $hub_upstream http://homehub-dashboard:3000;
        proxy_pass $hub_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-App-Slug $cookie_hh_app_slug;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirect legacy /login -> RideCheck login (app com basePath /ridecheck)
    location = /login { return 302 /ridecheck/login; }
    location = /login/ { return 302 /ridecheck/login; }

    # 5. RideCheck Web (pages + assets). O app roda com basePath=/ridecheck.
    location ~ ^/ridecheck/_next/ {
        set $rc_upstream http://ridecheck-web:3001;
        proxy_pass $rc_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }


    # Download direto do App Mobile Vistorias EN (APK)
    location = /downloads/vistorias.apk {
        alias /usr/share/nginx/html/downloads/vistorias.apk;
        add_header Content-Disposition 'attachment; filename="Vistorias-EN.apk"' always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Redirecionamento amigavel para /vistorias/
    location = /vistorias {
        return 301 /vistorias/;
    }

    # Vistorias EN - Painel Web e Endpoints API
    location /vistorias/ {
        client_max_body_size 50M;
        set $vistorias_upstream http://vistorias-web:3020;
        proxy_pass $vistorias_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Vistorias EN - Gateway Supabase (Auth, Rest, Storage, Realtime)
    location /vistorias-api/ {
        client_max_body_size 50M;
        proxy_pass http://172.18.0.1:54321/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Telemetria PGCSC - Expresso Nepomuceno
    location /telemetria {
        client_max_body_size 25M;
        set $telemetria_upstream http://telemetria:5000;
        proxy_pass $telemetria_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /telemetria;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

        # 3a-3. Decam AI Platform (/ia, /ia-static, /api/ai)
    location /ia {
        set $ai_upstream http://decam-ai-proxy:5050;
        proxy_pass $ai_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /ia-static/ {
        set $ai_upstream http://decam-ai-proxy:5050;
        proxy_pass $ai_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /api/ai/ {
        set $ai_upstream http://decam-ai-proxy:5050;
        proxy_pass $ai_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /health {
        set $ai_upstream http://decam-ai-proxy:5050;
        proxy_pass $ai_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location /ridecheck {
        set $rc_upstream http://ridecheck-web:3001;
        proxy_pass $rc_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }


    # 8. Command Panel
    location ^~ /command/run {
        limit_req zone=auth_limit burst=5 nodelay;
        auth_basic "Command Panel";
        auth_basic_user_file /etc/nginx/.htpasswd;
        set $cp_upstream http://172.18.0.1:5000;
        rewrite ^/command/(.*)$ /$1 break;
        proxy_pass $cp_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    location ^~ /command/ {
        auth_basic "Command Panel";
        auth_basic_user_file /etc/nginx/.htpasswd;
        set $cp_upstream http://172.18.0.1:5000;
        rewrite ^/command/(.*)$ /$1 break;
        proxy_pass $cp_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # 3c. Service Worker ORFAO do totem DECAM 3D.
    location = /sw.js {
        add_header Cache-Control "no-store" always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-Content-Type-Options "nosniff" always;
        default_type application/javascript;
        return 200 "self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',event=>{event.waitUntil((async()=>{await self.registration.unregister();const keys=await caches.keys();await Promise.all(keys.filter(key=>key.startsWith('decam-cache')).map(key=>caches.delete(key)));})())});";
    }

    
    # 4. HomeHub Dashboard (raiz)
    location / {
        set $hub_upstream http://homehub-dashboard:3000;
        proxy_pass $hub_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    types {
        text/html                             html htm shtml;
        text/css                              css;
        application/javascript                js;
        application/json                      json;
        image/png                             png;
        image/jpeg                            jpeg jpg;
        image/svg+xml                         svg;
        image/x-icon                          ico;
        model/gltf-binary                     glb;
        model/gltf+json                       gltf;
        application/octet-stream              bin obj;
    }
}


# Open WebUI Server Block (chat.decamservice.com, ia.decamservice.com, ai.decamservice.com)
server {
    listen 80;
    listen 8000;
    server_name chat.decamservice.com ia.decamservice.com ai.decamservice.com;

    location / {
        proxy_pass http://decam-ai-proxy:3008;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
